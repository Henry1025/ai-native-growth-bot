name: AI 新闻日报

on:
  schedule:
    # UTC 00:53 = 北京时间 08:53; UTC 01:07 = 北京时间 09:07
    - cron: "53 0 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: ai-news-daily-report
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run AI News Bot
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOC_TOKEN: ${{ secrets.FEISHU_DOC_TOKEN }}
          FEISHU_SHEET_TOKEN: ${{ secrets.FEISHU_SHEET_TOKEN }}
          SCREENING_MODEL: kimi-k2.6
          ANALYSIS_MODEL: kimi-k2.6
        run: python src/main.py

      - name: Preserve recovery inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: artifacts/*.json
          retention-days: 30
          if-no-files-found: ignore
